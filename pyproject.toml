[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "avalonops"
version = "0.2.0"
description = "SDK oficial da AvalonOps para Python — metadata de primeira classe sobre o SDK da OpenAI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["openai>=1.40,<3", "httpx>=0.25"]

[project.urls]
Repositorio = "https://github.com/Avalon-Ops/avalon-python-sdk"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/avalonops"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"

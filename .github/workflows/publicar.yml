name: Publicar no PyPI
on:
  push:
    tags: ['v*']
jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag bate com a versão do pyproject.toml?
        run: |
          [ "v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}" ] || { echo "::error::tag ${GITHUB_REF_NAME} nao bate com a versao do pyproject"; exit 1; }
      - run: python -m pip install -e '.[dev]' build
      - run: pytest -q
      - run: python -m build
      - name: Publicar (trusted publishing — portão humano da spec §9)
        uses: pypa/gh-action-pypi-publish@release/v1
